[workspace]
members = ["crates/pencil-array", "crates/pencil-fft", "crates/pencil-io", "crates/pencil-fftw"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/nogaki/pencil-rs"

[workspace.dependencies]
# rsmpi-rt keeps its library target named `mpi`, so the alias keeps `use mpi::...`
# working. It must stay on the same 0.x as tenferro-mpi (0.9.0): Cargo does not unify
# 0.8.x with 0.9.x, and two copies mean two incompatible `Communicator` types.
# default-features = false: no backend is selected implicitly; see the `system` and
# `runtime` features of each crate.
mpi = { package = "rsmpi-rt", version = "0.9.0", default-features = false }
thiserror = "2"
proptest = "1"
