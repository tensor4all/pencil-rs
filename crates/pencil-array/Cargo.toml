[package]
name = "pencil-array"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "MPI-distributed pencil arrays and transposes"
readme = "README.md"
include = ["Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "NOTICE.md", "src/**/*.rs", "tests/**/*.rs", "examples/**/*.rs"]

[package.metadata.docs.rs]
# rsmpi-rt does not compile without a backend.
features = ["system"]

[features]
default = []
# Same name as tenferro-mpi's. A backend is mandatory: rsmpi-rt refuses to compile
# without one. `system` is rsmpi-rt's bindgen backend (MPI headers, mpicc and libclang
# at build time). The `runtime` (mpi-native-sys) backend is deliberately not offered:
# in rsmpi-rt 0.9.0 it stubs MPI_Allreduce, MPI_Alltoallv, MPI_Cart_create, ...
system = ["mpi/mpi-sys-backend"]

[dependencies]
mpi = { workspace = true, features = ["complex"] }
num-complex = "0.4.6"
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
